<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Семейное древо Мелетяновых</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef1ea;
    color: #263126;
}

#app {
    position: fixed;
    inset: 0;
    overflow: hidden;
}

/* Верхняя панель */

#topbar {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 100;
    
    width: min(900px, calc(100% - 30px));
    
    background: rgba(255,255,255,0.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    
    border-radius: 20px;
    padding: 13px 18px;
    
    box-shadow:
        0 8px 30px rgba(0,0,0,0.12),
        0 2px 8px rgba(0,0,0,0.08);
    
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
}

.title-area {
    min-width: 0;
}

.title {
    font-size: 21px;
    font-weight: 700;
    white-space: nowrap;
}

.subtitle {
    margin-top: 3px;
    font-size: 12px;
    color: #6b746b;
    white-space: nowrap;
}

/* Кнопки */

.controls {
    display: flex;
    align-items: center;
    gap: 7px;
    flex-shrink: 0;
}

button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 12px;
    
    background: #f0f3ef;
    color: #263126;
    
    font-size: 21px;
    font-weight: 600;
    
    cursor: pointer;
    
    box-shadow: 0 2px 5px rgba(0,0,0,0.08);
    
    transition:
        transform 0.15s,
        background 0.15s;
}

button:hover {
    background: #e1e7df;
    transform: translateY(-1px);
}

button:active {
    transform: scale(0.94);
}

#homeBtn {
    font-size: 18px;
}

#fullscreenBtn {
    font-size: 17px;
}

/* Область дерева */

#viewport {
    position: absolute;
    inset: 0;
    overflow: hidden;
    
    cursor: grab;
    
    touch-action: none;
    
    background:
        radial-gradient(circle at center,
            rgba(255,255,255,0.75) 0%,
            rgba(238,241,234,0.95) 65%,
            #e8ece5 100%);
}

#viewport.dragging {
    cursor: grabbing;
}

/* Само дерево */

#tree {
    position: absolute;
    left: 0;
    top: 0;
    
    max-width: none;
    width: auto;
    height: auto;
    
    user-select: none;
    -webkit-user-drag: none;
    
    transform-origin: 0 0;
    
    will-change: transform;
    
    box-shadow: 0 12px 35px rgba(0,0,0,0.12);
}

/* Подсказка */

#hint {
    position: fixed;
    z-index: 90;
    
    left: 50%;
    bottom: 17px;
    transform: translateX(-50%);
    
    padding: 9px 15px;
    
    border-radius: 12px;
    
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px);
    
    color: #687168;
    font-size: 12px;
    
    box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    
    pointer-events: none;
    
    text-align: center;
}

/* Индикатор масштаба */

#zoomLabel {
    position: fixed;
    z-index: 90;
    
    right: 18px;
    bottom: 18px;
    
    padding: 8px 11px;
    
    border-radius: 10px;
    
    background: rgba(255,255,255,0.88);
    color: #5d665e;
    
    font-size: 12px;
    
    box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    
    pointer-events: none;
}

/* Полноэкранный режим */

:fullscreen #topbar {
    top: 12px;
}

:fullscreen #hint {
    bottom: 15px;
}

/* Телефон */

@media (max-width: 700px) {

    #topbar {
        top: 8px;
        width: calc(100% - 16px);
        padding: 10px 12px;
        border-radius: 16px;
    }

    .title {
        font-size: 16px;
    }

    .subtitle {
        font-size: 10px;
    }

    button {
        width: 36px;
        height: 36px;
        border-radius: 10px;
    }

    #hint {
        bottom: 10px;
        font-size: 10px;
        max-width: calc(100% - 30px);
    }

    #zoomLabel {
        right: 10px;
        bottom: 10px;
        display: none;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="viewport">
        <img
            id="tree"
            src="meletyan-tree.png"
            alt="Семейное древо Мелетяновых"
            draggable="false"
        >
    </div>

    <div id="topbar">

        <div class="title-area">
            <div class="title">🌳 Семейное древо Мелетяновых</div>
            <div class="subtitle">
                История семьи, которую мы сохраняем для будущих поколений
            </div>
        </div>

        <div class="controls">

            <button id="minusBtn" title="Уменьшить">
                −
            </button>

            <button id="homeBtn" title="Вернуться к начальной позиции">
                ⌂
            </button>

            <button id="plusBtn" title="Увеличить">
                +
            </button>

            <button id="fullscreenBtn" title="Полный экран">
                ⛶
            </button>

        </div>

    </div>

    <div id="hint">
        🖱 Перетаскивайте дерево мышкой · Колесо мыши — масштаб
    </div>

    <div id="zoomLabel">
        100%
    </div>

</div>

<script>

const viewport = document.getElementById("viewport");
const tree = document.getElementById("tree");

const minusBtn = document.getElementById("minusBtn");
const plusBtn = document.getElementById("plusBtn");
const homeBtn = document.getElementById("homeBtn");
const fullscreenBtn = document.getElementById("fullscreenBtn");
const zoomLabel = document.getElementById("zoomLabel");

let scale = 1;
let x = 0;
let y = 0;

let startX = 0;
let startY = 0;

let startPanX = 0;
let startPanY = 0;

let dragging = false;

let initialScale = 1;
let initialX = 0;
let initialY = 0;

const MIN_SCALE = 0.02;
const MAX_SCALE = 4;


/* --------------------------------
   Обновление положения дерева
-------------------------------- */

function updateTransform() {

    tree.style.transform =
        `translate(${x}px, ${y}px) scale(${scale})`;

    zoomLabel.textContent =
        Math.round(scale * 100) + "%";
}


/* --------------------------------
   Центрирование дерева
-------------------------------- */

function setInitialPosition() {

    const vw = viewport.clientWidth;
    const vh = viewport.clientHeight;

    const iw = tree.naturalWidth;
    const ih = tree.naturalHeight;

    if (!iw || !ih) return;

    /*
       Показываем дерево по высоте.

       Это намного удобнее, чем
       уменьшать огромное изображение
       целиком до маленькой полоски.
    */

    const availableHeight = vh - 130;

    initialScale = availableHeight / ih;

    /*
       Ограничиваем стартовый масштаб,
       чтобы он не стал слишком большим.
    */

    initialScale = Math.max(
        MIN_SCALE,
        Math.min(initialScale, 0.45)
    );

    scale = initialScale;

    /*
       Центрируем изображение
       по вертикали.
    */

    const scaledWidth = iw * scale;
    const scaledHeight = ih * scale;

    initialX =
        (vw - scaledWidth) / 2;

    initialY =
        (vh - scaledHeight) / 2 + 30;

    x = initialX;
    y = initialY;

    updateTransform();
}


/* --------------------------------
   Кнопка "Домой"
-------------------------------- */

homeBtn.addEventListener("click", () => {

    scale = initialScale;
    x = initialX;
    y = initialY;

    updateTransform();
});


/* --------------------------------
   Увеличение
-------------------------------- */

function zoomAtPoint(newScale, cx, cy) {

    newScale = Math.max(
        MIN_SCALE,
        Math.min(MAX_SCALE, newScale)
    );

    const worldX =
        (cx - x) / scale;

    const worldY =
        (cy - y) / scale;

    x =
        cx - worldX * newScale;

    y =
        cy - worldY * newScale;

    scale = newScale;

    updateTransform();
}


plusBtn.addEventListener("click", () => {

    const rect = viewport.getBoundingClientRect();

    zoomAtPoint(
        scale * 1.25,
        rect.width / 2,
        rect.height / 2
    );
});


minusBtn.addEventListener("click", () => {

    const rect = viewport.getBoundingClientRect();

    zoomAtPoint(
        scale / 1.25,
        rect.width / 2,
        rect.height / 2
    );
});


/* --------------------------------
   Колесо мыши
-------------------------------- */

viewport.addEventListener(
    "wheel",
    (event) => {

        event.preventDefault();

        const rect =
            viewport.getBoundingClientRect();

        const cx =
            event.clientX - rect.left;

        const cy =
            event.clientY - rect.top;

        const factor =
            event.deltaY < 0
                ? 1.12
                : 1 / 1.12;

        zoomAtPoint(
            scale * factor,
            cx,
            cy
        );
    },
    { passive: false }
);


/* --------------------------------
   Перетаскивание мышью
-------------------------------- */

viewport.addEventListener(
    "mousedown",
    (event) => {

        if (event.button !== 0) return;

        dragging = true;

        viewport.classList.add("dragging");

        startX = event.clientX;
        startY = event.clientY;

        startPanX = x;
        startPanY = y;
    }
);


window.addEventListener(
    "mousemove",
    (event) => {

        if (!dragging) return;

        x =
            startPanX +
            (event.clientX - startX);

        y =
            startPanY +
            (event.clientY - startY);

        updateTransform();
    }
);


window.addEventListener(
    "mouseup",
    () => {

        dragging = false;

        viewport.classList.remove("dragging");
    }
);


/* --------------------------------
   Телефон / планшет
-------------------------------- */

let touchStartX = 0;
let touchStartY = 0;

let touchStartPanX = 0;
let touchStartPanY = 0;

let pinchStartDistance = 0;
let pinchStartScale = 1;


function distance(a, b) {

    const dx = a.clientX - b.clientX;
    const dy = a.clientY - b.clientY;

    return Math.sqrt(
        dx * dx + dy * dy
    );
}


viewport.addEventListener(
    "touchstart",
    (event) => {

        if (event.touches.length === 1) {

            const t = event.touches[0];

            touchStartX = t.clientX;
            touchStartY = t.clientY;

            touchStartPanX = x;
            touchStartPanY = y;
        }

        if (event.touches.length === 2) {

            pinchStartDistance =
                distance(
                    event.touches[0],
                    event.touches[1]
                );

            pinchStartScale = scale;
        }

    },
    { passive: false }
);


viewport.addEventListener(
    "touchmove",
    (event) => {

        event.preventDefault();

        if (event.touches.length === 1) {

            const t =
                event.touches[0];

            x =
                touchStartPanX +
                (t.clientX - touchStartX);

            y =
                touchStartPanY +
                (t.clientY - touchStartY);

            updateTransform();
        }

        if (event.touches.length === 2) {

            const currentDistance =
                distance(
                    event.touches[0],
                    event.touches[1]
                );

            if (!pinchStartDistance) return;

            const factor =
                currentDistance /
                pinchStartDistance;

            const newScale =
                pinchStartScale * factor;

            const rect =
                viewport.getBoundingClientRect();

            const cx =
                (
                    event.touches[0].clientX +
                    event.touches[1].clientX
                ) / 2 - rect.left;

            const cy =
                (
                    event.touches[0].clientY +
                    event.touches[1].clientY
                ) / 2 - rect.top;

            zoomAtPoint(
                newScale,
                cx,
                cy
            );
        }

    },
    { passive: false }
);


/* --------------------------------
   Полный экран
-------------------------------- */

fullscreenBtn.addEventListener(
    "click",
    async () => {

        try {

            if (!document.fullscreenElement) {

                await document.documentElement.requestFullscreen();

            } else {

                await document.exitFullscreen();

            }

        } catch (error) {

            console.log(
                "Полноэкранный режим недоступен"
            );
        }
    }
);


/* --------------------------------
   После загрузки изображения
-------------------------------- */

tree.addEventListener(
    "load",
    () => {

        setInitialPosition();

    }
);


/* --------------------------------
   При изменении размера окна
-------------------------------- */

window.addEventListener(
    "resize",
    () => {

        /*
           При обычном изменении окна
           сохраняем текущий вид.
        */

        updateTransform();
    }
);


/* --------------------------------
   Запуск
-------------------------------- */

if (tree.complete) {

    setInitialPosition();

}

</script>

</body>
</html>
