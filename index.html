<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Семейное древо Мелетяновых</title>

<style>
* { box-sizing: border-box; }

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, Helvetica, sans-serif;
    background: #eeeae1;
    color: #2f302c;
}

#app {
    width: 100%;
    height: 100%;
    position: relative;
}

#topbar {
    position: fixed;
    z-index: 20;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    width: min(960px, calc(100% - 28px));
    min-height: 66px;
    padding: 10px 14px;
    border-radius: 18px;
    background: rgba(255,255,255,.94);
    box-shadow: 0 8px 30px rgba(0,0,0,.15);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    backdrop-filter: blur(10px);
}

.brand {
    min-width: 0;
}

.brand h1 {
    margin: 0;
    font-size: 20px;
    line-height: 1.15;
}

.brand p {
    margin: 4px 0 0;
    font-size: 12px;
    color: #73736d;
}

.controls {
    display: flex;
    gap: 7px;
    flex-shrink: 0;
}

.control {
    width: 42px;
    height: 42px;
    border: 0;
    border-radius: 12px;
    background: #f5f3ee;
    color: #33352f;
    font-size: 22px;
    cursor: pointer;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
}

.control:hover {
    background: #e9e6de;
}

.control:active {
    transform: scale(.95);
}

#viewer {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,.95), rgba(228,223,212,.96));
}

#viewer.dragging {
    cursor: grabbing;
}

#canvas {
    position: absolute;
    left: 50%;
    top: 50%;
    transform-origin: center center;
    will-change: transform;
}

#tree {
    display: block;
    max-width: none;
    max-height: none;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
}

#hint {
    position: fixed;
    z-index: 15;
    left: 50%;
    bottom: 16px;
    transform: translateX(-50%);
    padding: 9px 14px;
    border-radius: 12px;
    background: rgba(255,255,255,.88);
    color: #66675f;
    font-size: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
    text-align: center;
    pointer-events: none;
    transition: opacity .5s;
}

#zoom {
    position: fixed;
    z-index: 15;
    right: 16px;
    bottom: 16px;
    padding: 8px 11px;
    border-radius: 10px;
    background: rgba(255,255,255,.88);
    color: #66675f;
    font-size: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,.12);
    pointer-events: none;
}

#loading {
    position: fixed;
    inset: 0;
    z-index: 30;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #eeeae1;
    transition: opacity .4s;
}

.loading-box {
    text-align: center;
    background: rgba(255,255,255,.94);
    padding: 25px 32px;
    border-radius: 18px;
    box-shadow: 0 10px 35px rgba(0,0,0,.14);
}

.loading-box .tree-icon {
    font-size: 38px;
}

.loading-box div:last-child {
    margin-top: 8px;
    color: #666;
}

@media (max-width: 650px) {
    #topbar {
        top: 8px;
        width: calc(100% - 16px);
        min-height: 58px;
        padding: 8px 9px;
        border-radius: 15px;
    }

    .brand h1 {
        font-size: 16px;
    }

    .brand p {
        display: none;
    }

    .control {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        font-size: 19px;
    }

    #hint {
        bottom: 10px;
        max-width: calc(100% - 100px);
        font-size: 11px;
    }

    #zoom {
        right: 10px;
        bottom: 10px;
        font-size: 11px;
    }
}
</style>
</head>

<body>

<div id="app">

    <div id="loading">
        <div class="loading-box">
            <div class="tree-icon">🌳</div>
            <div>Загружаем семейное древо…</div>
        </div>
    </div>

    <header id="topbar">
        <div class="brand">
            <h1>🌳 Семейное древо Мелетяновых</h1>
            <p>История семьи, которую мы сохраняем для будущих поколений</p>
        </div>

        <div class="controls">
            <button class="control" id="minus" title="Уменьшить">−</button>
            <button class="control" id="home" title="Показать всё дерево">⌂</button>
            <button class="control" id="plus" title="Увеличить">+</button>
            <button class="control" id="fullscreen" title="Полный экран">⛶</button>
        </div>
    </header>

    <main id="viewer">
        <div id="canvas">
            <img
                id="tree"
                src="meletyan-tree.png"
                alt="Семейное древо Мелетяновых"
                draggable="false"
            >
        </div>
    </main>

    <div id="hint">
        🖱️ Перетаскивайте дерево • Колесо мыши — масштаб • На телефоне — щипок двумя пальцами
    </div>

    <div id="zoom">100%</div>

</div>

<script>

const viewer = document.getElementById('viewer');
const canvas = document.getElementById('canvas');
const tree = document.getElementById('tree');
const zoomText = document.getElementById('zoom');
const loading = document.getElementById('loading');
const hint = document.getElementById('hint');

let scale = 1;
let x = 0;
let y = 0;

let minScale = 0.01;
const maxScale = 8;

let pointers = new Map();

let dragging = false;
let startX = 0;
let startY = 0;
let startPanX = 0;
let startPanY = 0;

let pinchStartDistance = 0;
let pinchStartScale = 1;
let pinchStartCenter = null;

function update() {

    canvas.style.transform =
        `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(${scale})`;

    zoomText.textContent =
        Math.round(scale * 100) + '%';
}

function fitToScreen() {

    if (!tree.naturalWidth || !tree.naturalHeight) {
        return;
    }

    const vw = viewer.clientWidth;
    const vh = viewer.clientHeight;

    const sx = vw / tree.naturalWidth;
    const sy = vh / tree.naturalHeight;

    scale = Math.min(sx, sy) * 0.94;

    minScale = Math.max(scale * 0.45, 0.001);

    x = 0;
    y = 0;

    update();
}

function zoomAt(newScale, clientX, clientY) {

    const rect = viewer.getBoundingClientRect();

    const mx =
        clientX - rect.left - rect.width / 2;

    const my =
        clientY - rect.top - rect.height / 2;

    newScale =
        Math.max(minScale, Math.min(maxScale, newScale));

    const factor = newScale / scale;

    x = mx - (mx - x) * factor;
    y = my - (my - y) * factor;

    scale = newScale;

    update();
}

function distance(a, b) {

    return Math.hypot(
        a.clientX - b.clientX,
        a.clientY - b.clientY
    );
}

function center(a, b) {

    return {
        x: (a.clientX + b.clientX) / 2,
        y: (a.clientY + b.clientY) / 2
    };
}

tree.addEventListener('load', function() {

    fitToScreen();

    loading.style.opacity = '0';

    setTimeout(function() {
        loading.remove();
    }, 450);
});

viewer.addEventListener('wheel', function(e) {

    e.preventDefault();

    zoomAt(
        scale * (e.deltaY < 0 ? 1.15 : 0.87),
        e.clientX,
        e.clientY
    );

}, { passive: false });

viewer.addEventListener('pointerdown', function(e) {

    pointers.set(e.pointerId, e);

    try {
        viewer.setPointerCapture(e.pointerId);
    } catch (_) {}

    if (pointers.size === 1) {

        dragging = true;

        viewer.classList.add('dragging');

        startX = e.clientX;
        startY = e.clientY;

        startPanX = x;
        startPanY = y;

    } else if (pointers.size === 2) {

        const [a, b] = [...pointers.values()];

        pinchStartDistance = distance(a, b);

        pinchStartScale = scale;

        pinchStartCenter = center(a, b);

        dragging = false;
    }
});

viewer.addEventListener('pointermove', function(e) {

    if (!pointers.has(e.pointerId)) {
        return;
    }

    pointers.set(e.pointerId, e);

    if (pointers.size === 1 && dragging) {

        x =
            startPanX +
            e.clientX -
            startX;

        y =
            startPanY +
            e.clientY -
            startY;

        update();
    }

    if (pointers.size === 2) {

        const [a, b] = [...pointers.values()];

        const d = distance(a, b);

        if (pinchStartDistance > 0) {

            const newScale =
                pinchStartScale *
                (d / pinchStartDistance);

            zoomAt(
                newScale,
                pinchStartCenter.x,
                pinchStartCenter.y
            );
        }
    }
});

function endPointer(e) {

    pointers.delete(e.pointerId);

    if (pointers.size === 0) {

        dragging = false;

        viewer.classList.remove('dragging');
    }

    if (pointers.size < 2) {
        pinchStartDistance = 0;
    }
}

viewer.addEventListener('pointerup', endPointer);
viewer.addEventListener('pointercancel', endPointer);

document.getElementById('plus').addEventListener('click', function() {

    zoomAt(
        scale * 1.5,
        viewer.clientWidth / 2,
        viewer.clientHeight / 2
    );
});

document.getElementById('minus').addEventListener('click', function() {

    zoomAt(
        scale / 1.5,
        viewer.clientWidth / 2,
        viewer.clientHeight / 2
    );
});

document.getElementById('home').addEventListener('click', function() {

    fitToScreen();
});

document.getElementById('fullscreen').addEventListener('click', async function() {

    try {

        if (!document.fullscreenElement) {

            await document.documentElement.requestFullscreen();

        } else {

            await document.exitFullscreen();
        }

    } catch (_) {}
});

document.addEventListener('fullscreenchange', function() {

    document.getElementById('fullscreen').textContent =
        document.fullscreenElement ? '⤢' : '⛶';

    setTimeout(fitToScreen, 100);
});

document.addEventListener('keydown', function(e) {

    if (e.key === '+' || e.key === '=') {

        zoomAt(
            scale * 1.2,
            viewer.clientWidth / 2,
            viewer.clientHeight / 2
        );

    } else if (e.key === '-' || e.key === '_') {

        zoomAt(
            scale / 1.2,
            viewer.clientWidth / 2,
            viewer.clientHeight / 2
        );

    } else if (e.key === '0' || e.key === 'Home') {

        fitToScreen();
    }
});

setTimeout(function() {

    if (hint) {
        hint.style.opacity = '0.25';
    }

}, 8000);

</script>

</body>
</html>
